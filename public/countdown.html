<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Five Years of Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap">
<style>
  :root { --black: #0b0a0c; --white: #f6f4f2; --mute: #a39ea6; --rose: #f2a7b8; --gold: #e8c38a; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(60% 50% at 50% 110%, rgba(232,195,138,.22), transparent 70%),
      radial-gradient(50% 40% at 20% 0%, rgba(242,167,184,.16), transparent 70%),
      var(--black);
    color: var(--white); font-family: "Manrope", -apple-system, "Segoe UI", system-ui, sans-serif;
    display: grid; place-items: center; text-align: center;
    padding: max(24px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  }
  .kicker { font-size: 13px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
  h1 { margin: 16px 0 0; font-size: clamp(44px, 9vw, 110px); font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  h1 em { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; color: var(--rose); }
  .clock { margin-top: 48px; display: flex; justify-content: center; gap: clamp(14px, 4vw, 40px); }
  .clock div { display: grid; gap: 8px; min-width: 2.2ch; }
  .clock b { font-size: clamp(48px, 11vw, 120px); font-weight: 800; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #fff, var(--rose)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .clock span { font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
  .sub { margin-top: 40px; color: var(--mute); font-size: 17px; }
  .sub strong { color: var(--white); font-weight: 600; }
  .heart { display: inline-block; animation: beat 1.4s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } }
  /* at midnight: the clock gives way to one big heart that opens the site */
  main { transition: opacity .8s ease, transform .8s ease; }
  main.gone { opacity: 0; transform: scale(.94); pointer-events: none; }
  .open { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 22px; padding: 24px; opacity: 0; transition: opacity 1s ease; }
  .open.show { opacity: 1; }
  .open .kicker { font-size: 14px; }
  .open h2 { margin: 0; font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; font-size: clamp(38px, 8vw, 80px); line-height: 1.05; color: var(--rose); }
  .big-heart { width: min(64vw, 340px); aspect-ratio: 1; border: 0; padding: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
    filter: drop-shadow(0 0 40px rgba(255,77,109,.65)) drop-shadow(0 20px 40px rgba(0,0,0,.6)); animation: beat 1.4s ease-in-out infinite; }
  .big-heart svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .big-heart:focus-visible { outline: 2px solid var(--rose); outline-offset: 8px; border-radius: 24px; }
  .big-heart.go { animation: grow .9s cubic-bezier(.6,0,.4,1) forwards; }
  .tap { font-size: 13px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); }
  @keyframes grow { to { transform: scale(14); opacity: .9; } }
  @media (prefers-reduced-motion: reduce) { .heart, .big-heart { animation: none; } }
</style>
</head>
<body>
  <main>
    <span class="kicker">Sujith &amp; Sahana · 24 · 11 · 2021</span>
    <h1>Five years.<br><em>Almost.</em></h1>
    <div class="clock" aria-live="off">
      <div><b id="d">0</b><span>Days</span></div>
      <div><b id="h">00</b><span>Hours</span></div>
      <div><b id="m">00</b><span>Minutes</span></div>
      <div><b id="s">00</b><span>Seconds</span></div>
    </div>
    <p class="sub">Opens at <strong>midnight, 24 November</strong> <span class="heart">♡</span></p>
  </main>
  <div class="open" id="open" hidden>
    <span class="kicker">24 · 11 · 2026</span>
    <h2>Happy 5th anniversary, Sahana</h2>
    <button type="button" class="big-heart" id="big-heart" aria-label="Open our story">
      <svg viewBox="0 0 100 92" aria-hidden="true">
        <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b8a"/><stop offset=".55" stop-color="#e0294f"/><stop offset="1" stop-color="#8e1b33"/></linearGradient></defs>
        <path d="M50 90 C 20 68 2 50 2 28 C 2 12 14 2 28 2 C 38 2 46 8 50 17 C 54 8 62 2 72 2 C 86 2 98 12 98 28 C 98 50 80 68 50 90 Z" fill="url(#hg)"/>
        <path d="M20 16 C 26 10 36 10 40 18" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </button>
    <span class="tap">Tap the heart</span>
  </div>
<script>
  // Keep in step with OPEN_AT in functions/_middleware.js
  var openAt = Date.parse('2026-11-24T00:00:00-08:00');
  var pad = function (n) { return String(n).padStart(2, '0'); };
  function tick() {
    var left = Math.max(0, openAt - Date.now());
    var t = Math.floor(left / 1000);
    document.getElementById('d').textContent = Math.floor(t / 86400);
    document.getElementById('h').textContent = pad(Math.floor(t / 3600) % 24);
    document.getElementById('m').textContent = pad(Math.floor(t / 60) % 60);
    document.getElementById('s').textContent = pad(t % 60);
    if (left === 0) { clearInterval(timer); showHeart(); }
  }
  function showHeart() {
    document.querySelector('main').classList.add('gone');
    var o = document.getElementById('open');
    o.hidden = false;
    requestAnimationFrame(function () { requestAnimationFrame(function () { o.classList.add('show'); }); });
  }
  document.getElementById('big-heart').addEventListener('click', function () {
    this.classList.add('go');
    setTimeout(function () { location.replace('/'); }, 800);
  });
  var timer = setInterval(tick, 1000);
  tick();
  if (/[?&]heart\b/.test(location.search)) { clearInterval(timer); showHeart(); } // preview: /countdown?heart
</script>
</body>
</html>
